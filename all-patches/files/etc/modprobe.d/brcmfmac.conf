# brcmfmac 稳定性修复 —— NanoPi M4B (AP6256 / BCM4345/9, SDIO)
#
# 现象：AP 模式下固件不定时崩溃，dmesg 报
#   ieee80211 phyX: brcmf_fw_crashed: Firmware has halted or crashed
#   brcmfmac mmc0:0001:1 ...: bus is down. we have nothing to do.
# 随后 brcmfmac 触发 mmc_hw_reset 复位 SDIO，phy 索引递增(phy0->phy1->...)，
# 反复发生（约每 10+ 分钟一次）。
#
# 根因：该模组固件为 2017 年的 7.45.96.2 (FWID 01-1813af84)，对以下
# brcmfmac 上报的“新功能”支持不良，开启后固件内部 assert 崩溃：
#   - FWSUP   (bit13): 固件内置 supplicant
#   - SAE     (bit19): WPA3 SAE 认证
#   - DUMP_OBSS(bit21): ACS 邻频扫描 dump
# 关闭这些功能 + 禁用固件内部 roaming 引擎，即可消除崩溃。
# 此组合 (roamoff=1 feature_disable=0x282000) 为 brcmfmac 社区/RPi 维护者
# 对同类固件崩溃的标准修法（feature_disable 位序依据内核 6.6 feature.h）。
#
# 注意：关闭 SAE 后 WPA3-Personal 不可用（该老固件本就不支持 WPA3，
# hostapd 侧用 WPA2 即可）；关闭 DUMP_OBSS 后 ACS 自动选频退化为软件扫描。

options brcmfmac roamoff=1 feature_disable=0x282000
