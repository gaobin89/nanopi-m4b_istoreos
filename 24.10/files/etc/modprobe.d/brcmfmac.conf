# brcmfmac 稳定性修复 —— NanoPi M4B (AP6256 / BCM4345/9, SDIO)
#
# 现象：AP(Hostapd) 模式下固件不定时崩溃，dmesg 报
#   ieee80211 phyX: brcmf_fw_crashed: Firmware has halted or crashed
#   brcmfmac mmc0:0001:1 ...: bus is down. we have nothing to do.
# 之后 brcmfmac 触发 mmc_hw_reset 复位 SDIO，radio 以新 phy 索引(phy0->phy1->...)重枚举。
#
# 根因与分层修复（按优先级）：
#   (1) 固件本身缺陷：早期随 armbian 提供的 brcmfmac43456-sdio.bin 是 2017 年的
#       7.45.96.2 (FWID 01-1813af84)，社区确认其在 AP 模式下"known to crash"。
#       已在 005 补丁中把 .bin 换成 RPi 维护的 7.84.17.1 (FWID 01-3d9e1d87, 2020-05)，
#       这是 AP6256/43456 在 AP 模式下稳定性显著更好的版本，是"彻底修复"的主手段。
#   (2) feature_disable 兜底：即便换了固件，仍关闭固件里对老/小众功能支持不良、
#       易触发崩溃或 Assert 的位，进一步降低崩溃概率（不能 100% 根除，故为兜底）。
#
# feature_disable 位序严格对照内核 6.12 brcmfmac/feature.h 的 enum（0 基，位 N = 1<<N）：
#   0 MBSS 1 MCHAN 2 PNO 3 WOWL 4 P2P 5 RSDB 6 TDLS 7 SCAN_RANDOM_MAC
#   8 WOWL_ND 9 WOWL_GTK 10 WOWL_ARP_ND 11 MFP 12 GSCAN 13 FWSUP 14 MONITOR
#   15 MONITOR_FLAG 16 MONITOR_FMT_RADIOTAP 17 MONITOR_FMT_HW_RX_HDR 18 DOT11H
#   19 SAE 20 FWAUTH 21 DUMP_OBSS 22 SCAN_V2 23 PMKID_V2 24 PMKID_V3
#   0x28A000 = bit13(FWSUP) + bit15(MONITOR_FLAG) + bit19(SAE) + bit21(DUMP_OBSS)
#   - FWSUP(bit13):     关闭固件内置 supplicant，改由 hostapd 软件实现，避开固件 supplicant 的 bug
#   - SAE(bit19):       关闭 WPA3-SAE（该固件本就不支持 WPA3，hostapd 侧用 WPA2 即可）
#   - DUMP_OBSS(bit21): 关闭 ACS 邻频扫描 dump（关闭后 ACS 退化为软件扫描，无害）
#   - MONITOR_FLAG(bit15): 顺带关闭 monitor 包标记（对 AP 无影响，无害）
#   说明：早期 mask 曾误把 SAE 标成 bit15、SCAN_V2 标成 bit19（实际 SAE=bit19、SCAN_V2=bit22），
#   但 0x28A000 实际已正确关闭 SAE(bit19)；SCAN_V2(bit22)未被关闭。若仍出现扫描相关崩溃，
#   可追加 bit22 → 0x68A000（回退旧扫描 API，无害）。
#
# roamoff=1：禁用固件内部 roaming 引擎（AP6256 老固件 roaming 引擎有 bug，易触发复位）。
#
# 即便固件仍偶发崩溃，files/etc/hotplug.d/ieee80211/99-brcmfmac-recover 会在
# 新 phy 重枚举时自动 `wifi up` 恢复 AP，无需人工介入（兜底中的兜底）。

options brcmfmac roamoff=1 feature_disable=0x28A000
