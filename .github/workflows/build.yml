name: Build iStoreOS 24.10 (NanoPi M4B)

# 触发方式：仅手动触发（Actions 页面 -> Run workflow）
# 产物：构建出的 M4B 镜像重命名为「yyyy-mm-dd_原镜像名」后，固定发布到 tag「iStoreOS-24.10」。
#       （Git tag 名不能含空格，故 tag 用 iStoreOS-24.10；发布标题显示为 “iStoreOS 24.10”。）
#       增量发布：每次手动构建把新镜像追加到同一 Release，不删除/覆盖历史发布。
# 补丁布局：本仓库（gaobin89/nanopi-m4b_istoreos）根目录含 all-patches/ 子目录。
#       脚本把该目录移入 iStoreOS 克隆目录后，apply.sh/build.sh 通过 $0 自定位，无需额外 env 变量。
# 注意：本仓库所有补丁/脚本由 AI 生成，作者仅为分享，不保证及时修复；
#       如遇编译失败，请参考 README「如何反馈问题」交由 AI 处理或自行 fork 修改。
on:
  workflow_dispatch:
    inputs:
      istoreos_repo:
        description: 'iStoreOS 源码仓库地址'
        required: true
        default: 'https://github.com/istoreos/istoreos'
      istoreos_ref:
        description: 'iStoreOS 24.10 分支/标签（补丁基于 istoreos-24.10 验证）'
        required: true
        default: 'istoreos-24.10'

permissions:
  contents: write   # 需要创建/删除 Release 与 tag

concurrency:
  group: build-nanopi-m4b
  cancel-in-progress: false   # 串行执行，避免同一 tag 并发冲突

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360       # 上限 6 小时；iStoreOS 全量编译可能较久，超时请改用更大/自托管 runner
    env:
      RELEASE_TAG: iStoreOS-24.10      # Git tag（不可含空格）；固定 tag，增量发布不覆盖历史
      RELEASE_NAME: iStoreOS 24.10     # Release 标题（可含空格，用户在 Releases 页看到）
    steps:
      - name: Checkout 本仓库（补丁与脚本，根目录含 all-patches/）
        uses: actions/checkout@v4
        with:
          path: patches

      - name: 安装编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison gawk gcc-multilib g++-multilib \
            gettext libncurses5-dev libssl-dev libelf-dev python3 \
            python3-setuptools python3-pyelftools python3-dev python3-pip python3-ply swig \
            autoconf automake libtool cmake ninja-build pkg-config ccache \
            rsync unzip zlib1g-dev file wget vim git \
            perl bzip2 xz-utils zstd
          echo "=== 磁盘剩余 ==="
          df -h /

      - name: 克隆 iStoreOS 源码
        run: |
          git clone "${{ inputs.istoreos_repo }}" -b "${{ inputs.istoreos_ref }}" istoreos
          cd istoreos && git rev-parse HEAD

      - name: 缓存 dl/ 下载目录（保存源码 tarball，省下载时间）
        uses: actions/cache@v4
        with:
          # 实测本地 dl/ 约 2.6G（含 go-mod-cache）；与 ccache/feeds 合计仍低于 GitHub 每仓库 10G 缓存上限
          path: istoreos/dl
          key: dl-${{ inputs.istoreos_ref }}-${{ hashFiles('patches/all-patches/feeds.conf.default') }}-v2
          restore-keys: |
            dl-${{ inputs.istoreos_ref }}-v2
            dl-${{ inputs.istoreos_ref }}-

      - name: 缓存 .ccache/ 编译缓存（命中后热编译大幅加速，近似续跑）
        uses: actions/cache@v4
        with:
          # 种子 .config 已开 CONFIG_CCACHE=y，此处把编译缓存持久化到 istoreos/.ccache
          path: istoreos/.ccache
          key: ccache-${{ hashFiles('patches/all-patches/.config') }}-v1
          restore-keys: |
            ccache-

      - name: 缓存 feeds/ 源索引（省去 feeds update 阶段的 git clone）
        uses: actions/cache@v4
        with:
          # 实测 feeds/ 约 367M；缓存后 ./scripts/feeds update 只需 git pull 增量，
          # 而非全量 clone。key 绑定 feeds.conf.default，源清单变了自动失效。
          path: istoreos/feeds
          key: feeds-${{ inputs.istoreos_ref }}-${{ hashFiles('patches/all-patches/feeds.conf.default') }}-v1
          restore-keys: |
            feeds-${{ inputs.istoreos_ref }}-

      - name: 将 all-patches 移入 iStoreOS 克隆目录
        run: |
          # 本仓库根目录含 all-patches/ 子目录；移入 istoreos/ 后，
          # `bash all-patches/apply.sh` 会通过 $0 自动定位到 istoreos/all-patches，
          # 同时 apply.sh 内的 `git clean -e all-patches` 也会保护它不被清理。
          mv "$GITHUB_WORKSPACE/patches/all-patches" "$GITHUB_WORKSPACE/istoreos/all-patches"
          test -f "$GITHUB_WORKSPACE/istoreos/all-patches/apply.sh" \
            || { echo "!! 未找到 all-patches/apply.sh，请检查仓库结构（应为仓库根目录下的 all-patches/）"; exit 1; }
          echo "已就位: $GITHUB_WORKSPACE/istoreos/all-patches"

      - name: 套用补丁（apply.sh）
        run: |
          cd istoreos
          bash all-patches/apply.sh "$(pwd)"

      - name: 校验关键补丁是否生效
        run: |
          cd istoreos
          fail=0
          grep -q "friendlyarm_nanopi-m4b" target/linux/rockchip/image/armv8.mk \
            || { echo "!! 001 未生效（armv8.mk 无 M4B 设备）"; fail=1; }
          grep -q "nanopi-m4b-rk3399" package/boot/uboot-rockchip/Makefile \
            || { echo "!! 002 未生效（uboot Makefile 无 M4B 变体）"; fail=1; }
          test -f package/firmware/brcmfmac-firmware-43456/Makefile \
            || { echo "!! 005 未生效（43456 固件包缺失）"; fail=1; }
          grep -q "DEVICE_friendlyarm_nanopi-m4b=y" .config \
            || { echo "!! .config 未选中 M4B 设备"; fail=1; }
          test -f files/etc/modprobe.d/brcmfmac.conf \
            || { echo "!! brcmfmac.conf 覆盖层缺失"; fail=1; }
          exit $fail

      - name: 更新并安装 feeds + defconfig
        run: |
          cd istoreos
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          make defconfig

      - name: 配置 ccache（目录指向 istoreos/.ccache，上限 6G）
        run: |
          CCACHE_DIR="$GITHUB_WORKSPACE/istoreos/.ccache"
          mkdir -p "$CCACHE_DIR"
          ccache --max-size=6G
          ccache -s
          # 写入 GITHUB_ENV 供后续编译步骤继承
          echo "CCACHE_DIR=$CCACHE_DIR" >> "$GITHUB_ENV"

      - name: 编译（build.sh，干净 PATH）
        run: |
          cd istoreos
          bash all-patches/build.sh -j"$(nproc)"

      - name: 收集镜像并重命名（加 yyyy-mm-dd 前缀）
        id: collect
        run: |
          mkdir -p artifacts
          DATE="$(TZ=Asia/Shanghai date +%F)"   # 日期按北京时间
          shopt -s nullglob
          for f in istoreos/bin/targets/rockchip/armv8/*nanopi-m4b*.img*; do
            base="$(basename "$f")"
            cp "$f" "artifacts/${DATE}_${base}"
          done
          shopt -u nullglob
          ls -lh artifacts
          test "$(ls -A artifacts 2>/dev/null)" \
            || { echo "!! 未找到镜像，编译可能失败"; exit 1; }

      - name: 创建 Release（固定 tag，若不存在则新建）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG 已存在，将增量追加新镜像（不覆盖历史）"
          else
            NOTES="iStoreOS 24.10 适配 NanoPi M4B (RK3399 + AP6256) 的自动构建镜像。
          镜像文件名已加日期前缀（yyyy-mm-dd_原镜像名），每次手动构建增量追加到本 Release，不覆盖历史发布。
          由 GitHub Actions 基于本仓库补丁与脚本自动编译；仅供技术分享，作者不保证及时修复。
          使用与问题请参考仓库 README。"
            gh release create "$RELEASE_TAG" --title "$RELEASE_NAME" --notes "$NOTES"
          fi

      - name: 增量上传镜像到固定 tag（按日期前缀累加）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 不同日期的镜像文件名互不相同，会逐次累加；同一天重复运行用 --clobber 仅刷新当天镜像。
          gh release upload "$RELEASE_TAG" artifacts/* --clobber
